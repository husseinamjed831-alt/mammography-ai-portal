<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Presentations use Segoe UI (present on Windows/Office). On the Linux
     render server, draw it with Tajawal so PDF previews look right. -->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Tajawal</family></prefer>
  </alias>
</fontconfig>
